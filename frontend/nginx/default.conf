# Production: serves the built SPA and proxies /api to the backend, so the browser only ever talks to ONE origin
# (no CORS needed, strict connect-src). TLS is expected to terminate in front of this container.
# Backend requirement (BE-4): run it with SPRING_PROFILES_ACTIVE=behind-proxy and TRUSTED_PROXIES set to THIS
# proxy's address (plus any load balancer in front), so per-IP rate limits, the login throttle and audit IPs see the
# real client. Only when the backend is reachable solely through this proxy: never publish its port 8080.

# F4: keep a caller's X-Request-Id (an MCP client tracing a call end to end) if it is well formed, using the same
# rule as the backend's RequestIdFilter; otherwise use nginx's own id. Never forwards arbitrary header content.
map $http_x_request_id $ecom_request_id {
    "~^[A-Za-z0-9._-]{8,64}$" $http_x_request_id;
    default                   $request_id;
}

server {
    listen 8080;
    server_name _;
    root /usr/share/nginx/html;
    server_tokens off;
    client_max_body_size 1m;

    location /api/ {
        proxy_pass http://backend:8080;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_set_header X-Request-Id $ecom_request_id;
    }

    # Hashed build assets never change: cache forever.
    location /assets/ {
        include /etc/nginx/security-headers.conf;
        add_header Cache-Control "public, max-age=31536000, immutable" always;
        try_files $uri =404;
    }

    # Everything else is the SPA shell: never cache it, so a deploy is picked up immediately.
    location / {
        include /etc/nginx/security-headers.conf;
        add_header Cache-Control "no-store" always;
        try_files $uri /index.html;
    }
}
