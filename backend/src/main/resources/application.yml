spring:
  application:
    name: ecom-backend
  datasource:
    url: ${DB_URL:jdbc:postgresql://localhost:5432/ecom}
    username: ${DB_USERNAME:ecom}
    password: ${DB_PASSWORD}
    hikari:
      # R2: bound every row-lock wait; a timeout surfaces as 409 CONFLICT (retryable) instead of a hung request
      connection-init-sql: "SET lock_timeout = '5s'"
  jpa:
    open-in-view: false
    hibernate:
      ddl-auto: validate          # Flyway owns the schema
    properties:
      hibernate:
        jdbc.time_zone: UTC
  flyway:
    enabled: true
  jackson:
    deserialization:
      fail-on-unknown-properties: true   # reject unexpected fields (mass-assignment defence)

server:
  port: ${PORT:8080}
  max-http-request-header-size: 16KB
  error:
    include-message: never
    include-stacktrace: never
    include-binding-errors: never

management:
  endpoints:
    web:
      exposure:
        include: health
  endpoint:
    health:
      show-details: never

springdoc:
  # Off by default (L5); set API_DOCS_ENABLED=true in dev or for the MCP server's build step.
  api-docs:
    enabled: ${API_DOCS_ENABLED:false}
  swagger-ui:
    enabled: ${API_DOCS_ENABLED:false}

app:
  currency: USD
  jobs:
    enabled: ${JOBS_ENABLED:true}
  sod:
    # R10: strict = different people for each step; small-team = one person may do several steps
    # with a sodOverrideReason (audited as SOD_OVERRIDDEN). Own-order/own-return rules are never relaxed.
    mode: ${SOD_MODE:strict}
  orders:
    payment-timeout: 30m          # unpaid orders auto-cancel and release stock after this
    max-open-unpaid-per-user: 3
  security:
    jwt:
      secret: ${JWT_SECRET:}
      issuer: ecom-backend
      access-token-ttl: 15m
      refresh-token-ttl: 14d
    cors:
      allowed-origins: ${CORS_ALLOWED_ORIGINS:http://localhost:3000}
    rate-limit:
      principal-requests-per-minute: 120   # per user / per API key
      ip-requests-per-minute: 600          # coarse pre-auth guard (the MCP server is one IP)
      auth-requests-per-minute: 10         # POST /api/v1/auth/* per IP
    login-throttle:
      max-attempts: 5            # per (account, IP)
      window: 15m
      account-max-failures: 20   # R5: per account across all IPs
      account-window: 1h
  bootstrap:
    admin-email: ${BOOTSTRAP_ADMIN_EMAIL:}
    admin-password: ${BOOTSTRAP_ADMIN_PASSWORD:}

logging:
  pattern:
    level: "%5p [rid=%X{requestId:-}]"
